<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-TYPE THE BIG CAT</title>
    <!-- 구글 폰트(Black Han Sans) 불러오기 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">

    <style>
        /* 부드러운 스크롤 이동 효과 적용 */
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            background-color: #000000; /* 배경색: 검은색 */
            color: #ff0000;          /* 전체 글자색: 빨간색 */
            text-align: center;
            margin: 0;
            padding: 0;
        }
        
        /* 상단 메인 히어로 섹션 */
        .hero-section {
            padding-top: 80px;
            padding-bottom: 50px;
            border-bottom: 2px solid #330000; 
        }

        h1 {
            font-family: 'Black Han Sans', sans-serif;
            color: #ff0000;          
            font-size: 72px;         
            letter-spacing: 2px;     
            margin-bottom: 10px;
        }

        p {
            color: #ff4d4d;          
            font-size: 20px;         
        }

        .site-image {
            width: 300px;            
            border-radius: 10px;     
            margin: 20px 0;          
        }

        .icon-container {
            margin-top: 25px;
            display: flex;            
            justify-content: center; 
            align-items: center;     
            gap: 30px;               
        }

        .social-icon-link {
            display: inline-block;
            width: 80px;             
            height: 80px;
            transition: transform 0.2s;
        }

        .social-icon-link:hover {
            transform: scale(1.1);   
        }

        .social-icon {
            width: 100%;             
            height: 100%;
            object-fit: contain;     
        }

        /* 디스코그래피 섹션 스타일 */
        .content-section {
            padding: 80px 20px;
            border-bottom: 2px solid #330000;
        }

        .content-section h2, .info-section h2 {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 45px;
            color: #ff0000;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        /* 앨범 목록 레이아웃 */
        .album-grid {
            display: flex;
            flex-wrap: nowrap;       
            justify-content: center;
            gap: 20px;
            max-width: 1300px;
            margin: 0 auto;
            overflow-x: auto;        
            padding-top: 15px;       
            padding-bottom: 20px;    
        }

        /* 앨범 링크 (기본 링크 밑줄 및 색상 제거) */
        .album-link {
            text-decoration: none;
            flex: 1;
            min-width: 200px;
        }

        /* 개별 앨범 카드 */
        .album-card {
            background-color: #110000;
            border: 1px solid #400000;
            border-radius: 10px;
            height: 100%;
            padding: 15px;
            transition: transform 0.2s, border-color 0.2s;
            box-sizing: border-box;
        }

        .album-link:hover .album-card {
            transform: translateY(-8px); 
            border-color: #ff0000;
        }

        .album-cover {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .album-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .album-year {
            font-size: 14px;
            color: #ff4d4d;
        }

        /* 전체 곡 한눈에 보기 섹션 스타일 */
        .master-track-section {
            padding: 80px 20px;
            border-bottom: 2px solid #330000;
            max-width: 1100px;
            margin: 0 auto;
            text-align: left;
        }

        .master-track-section h2 {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 45px;
            color: #ff0000;
            margin-bottom: 30px;
            letter-spacing: 1px;
            text-align: center;
        }

        /* 전체 곡 리스트 컨테이너 (높이 확장형) */
        .master-table-container {
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid #400000;
            border-radius: 8px;
            background-color: #0b0000;
            margin-bottom: 30px;
        }

        .master-table-container::-webkit-scrollbar {
            width: 8px;
        }
        .master-table-container::-webkit-scrollbar-thumb {
            background: #400000;
            border-radius: 4px;
        }

        .master-table {
            width: 100%;
            border-collapse: collapse;
            color: #e0e0e0;
        }

        .master-table th, .master-table td {
            border-bottom: 1px solid #300000;
            padding: 12px 15px;
            text-align: left;
            font-size: 14px;
        }

        .master-table th {
            background-color: #1a0000;
            color: #ff4d4d;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .master-table tr:hover {
            background-color: #1f0000;
        }

        /* 선택된 곡 플레이어 및 가사 영역 */
        .master-player-display {
            background: #110000;
            border: 1px solid #400000;
            padding: 25px;
            border-radius: 10px;
        }

        .master-player-title {
            font-size: 20px;
            font-weight: bold;
            color: #ff5252;
            margin-bottom: 15px;
            text-align: center;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 비율 */
            height: 0;
            margin-bottom: 20px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 6px;
        }

        .lyrics-toggle-btn {
            background-color: #330000;
            color: #ff4d4d;
            border: 1px solid #ff0000;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            display: block;
            margin: 0 auto 15px auto;
            transition: background 0.2s;
        }
        .lyrics-toggle-btn:hover {
            background-color: #550000;
        }

        .lyrics-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: #080000;
            border-radius: 6px;
            padding: 0 15px;
        }
        .lyrics-container.show {
            max-height: 400px;
            overflow-y: auto;
            padding: 15px;
            border: 1px solid #400000;
        }
        .lyrics-header {
            font-weight: bold;
            color: #ff5252;
            margin-bottom: 8px;
            text-align: center;
        }
        .lyrics-text {
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.6;
            color: #ccc;
            text-align: left;
        }

        .clickable-link {
            color: #ff4d4d;
            text-decoration: none;
            cursor: pointer;
        }
        .clickable-link:hover {
            text-decoration: underline;
            color: #ff8080;
        }

        /* 싱글 및 참여 음반 섹션 */
        .info-section {
            padding: 80px 20px;
            border-bottom: 2px solid #330000;
            max-width: 900px;
            margin: 0 auto;
            text-align: left;
        }
        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            color: #e0e0e0;
        }
        .info-table th, .info-table td {
            border: 1px solid #400000;
            padding: 10px 12px;
            text-align: left;
            font-size: 14px;
        }
        .info-table th {
            background-color: #1a0000;
            color: #ff4d4d;
        }
        .info-table tr:hover {
            background-color: #150000;
        }
    </style>
</head>
<body>

    <!-- 1. 최상단 메인 영역 -->
    <div class="hero-section">
        <h1>P-TYPE THE BIG CAT</h1>
        <p>이곳은 피타입의 음악들의 정보를 담은 웹사이트입니다.</p>
        
        <div>
            <img src="img/P-TYPE.jpg" alt="피타입 사진" class="site-image">
        </div>

        <div class="icon-container">
            <a href="https://www.instagram.com/ptype_thebigcat?utm_source=ig_web_button_share_sheet&igsi=ZDNlZDc0MzIxNw==" target="_blank" class="social-icon-link">
                <img src="img/instagram.png" alt="인스타그램" class="social-icon">
            </a>
            
            <a href="Https://www.youtube.com/channel/UC_BBrruv8aajni5I9muvtEw" target="_blank" class="social-icon-link">
                <img src="img/youtube.png" alt="유튜브" class="social-icon">
            </a>

            <a href="https://music.youtube.com/channel/UC_BBrruv8aajni5I9muvtEw?si=ZB1nuf0cdEgdFKBM" target="_blank" class="social-icon-link">
                <img src="img/youtubemusic.png" alt="유튜브 뮤직" class="social-icon">
            </a>
        </div>
    </div>

    <!-- 2. 정규앨범 5개 가로 한 줄 디스코그래피 구역 -->
    <div class="content-section">
        <h2>DISCOGRAPHY</h2>
        
        <div class="album-grid">
            <!-- 1집 링크 -->
            <a href="#master-section" class="album-link" onclick="filterTracks('Heavy Bass')">
                <div class="album-card">
                    <img src="img/album1.png" alt="1집 앨범 커버" class="album-cover">
                    <div class="album-title">Heavy Bass</div>
                    <div class="album-year">2004.05.31</div>
                </div>
            </a>

            <!-- 2집 링크 -->
            <a href="#master-section" class="album-link" onclick="filterTracks('The Vintage')">
                <div class="album-card">
                    <img src="img/album2.png" alt="2집 앨범 커버" class="album-cover">
                    <div class="album-title">The Vintage</div>
                    <div class="album-year">2008.11.27</div>
                </div>
            </a>

            <!-- 3집 링크 -->
            <a href="#master-section" class="album-link" onclick="filterTracks('RAP')">
                <div class="album-card">
                    <img src="img/album3.png" alt="3집 앨범 커버" class="album-cover">
                    <div class="album-title">RAP</div>
                    <div class="album-year">2013.07.29</div>
                </div>
            </a>

            <!-- 4집 링크 -->
            <a href="#master-section" class="album-link" onclick="filterTracks('Street Poetry')">
                <div class="album-card">
                    <img src="img/album4.png" alt="4집 앨범 커버" class="album-cover">
                    <div class="album-title">Street Poetry</div>
                    <div class="album-year">2015.03.20</div>
                </div>
            </a>

            <!-- 5집 링크 -->
            <a href="#master-section" class="album-link" onclick="filterTracks('Hardboiled Café 5')">
                <div class="album-card">
                    <img src="img/album5.png" alt="5집 앨범 커버" class="album-cover">
                    <div class="album-title">Hardboiled Café 5</div>
                    <div class="album-year">2022.02.18</div>
                </div>
            </a>
        </div>
    </div>

    <!-- 3. 전체 곡 한눈에 보기 및 플레이어 섹션 -->
    <div id="master-section" class="master-track-section">
        <h2>ALL TRACKS</h2>
        
        <div style="margin-bottom: 15px; text-align: right;">
            <button class="lyrics-toggle-btn" style="display:inline-block; margin:0;" onclick="filterTracks('ALL')">전체 곡 보기</button>
        </div>

        <div class="master-table-container">
            <table class="master-table">
                <thead>
                    <tr>
                        <th>앨범명</th>
                        <th>트랙</th>
                        <th>제목 (클릭)</th>
                        <th>작사</th>
                        <th>작곡</th>
                        <th>편곡</th>
                    </tr>
                </thead>
                <tbody id="master-track-tbody">
                    <!-- 자바스크립트로 전체 곡 리스트가 동적 삽입됩니다 -->
                </tbody>
            </table>
        </div>

        <!-- 선택된 곡 실시간 재생 및 가사 영역 -->
        <div class="master-player-display" id="master-player">
            <div class="master-player-title" id="player-title">곡을 선택해주세요</div>
            <div class="video-container">
                <iframe id="player-iframe" src="" allowfullscreen></iframe>
            </div>
            <button class="lyrics-toggle-btn" onclick="toggleMasterLyrics()">가사 보기 ▼</button>
            <div class="lyrics-container" id="player-lyrics-box">
                <div class="lyrics-header">[ 가 사 ]</div>
                <div class="lyrics-text" id="player-lyrics-text">가사가 없습니다.</div>
            </div>
        </div>
    </div>

    <!-- 4. 싱글 및 참여 음반 섹션 -->
    <div class="info-section">
        <h2>Singles & EPs</h2>
        <table class="info-table">
            <thead>
                <tr><th>발매일</th><th>제목</th><th>종류</th></tr>
            </thead>
            <tbody id="singles-tbody"></tbody>
        </table>
    </div>

    <div class="info-section">
        <h2>Participation / OST</h2>
        <table class="info-table">
            <thead>
                <tr><th>발매일</th><th>제목</th><th>종류</th><th>설명</th></tr>
            </thead>
            <tbody id="participation-tbody"></tbody>
        </table>
    </div>

    <!-- 순서 중요: lyrics.js가 data.js보다 위에 있어야 합니다 -->
    <script src="lyrics.js"></script>
    <script src="data.js"></script>

    <script>
        let allTracksData = [];
        let currentSelectedTrack = null;
        let isLyricsOpen = false;

        // 모든 앨범의 데이터를 하나의 배열로 통합 추출
        function initMasterTracks() {
            allTracksData = [];
            if (typeof albumsData === 'undefined') return;

            Object.keys(albumsData).forEach(albumKey => {
                const album = albumsData[albumKey];
                album.tracks.forEach(track => {
                    allTracksData.push({
                        albumId: albumKey,
                        albumTitle: album.title,
                        defaultVideo: album.defaultVideo,
                        trackNum: track[0],
                        title: track[1],
                        lyricist: track[2],
                        composer: track[3],
                        arranger: track[4],
                        videoId: track[5],
                        lyricKey: track[6]
                    });
                });
            });
            renderMasterTable(allTracksData);
            
            // 첫 번째 곡을 기본 선택
            if (allTracksData.length > 0) {
                selectMasterTrack(0);
            }
        }

        // 테이블에 곡 리스트 렌더링
        function renderMasterTable(tracks) {
            const tbody = document.getElementById('master-track-tbody');
            if (!tbody) return;

            tbody.innerHTML = tracks.map((t, idx) => `
                <tr id="track-row-${idx}" style="cursor: pointer;" onclick="selectMasterTrack(${idx})">
                    <td style="color: #ff4d4d; font-size: 13px;">${t.albumTitle}</td>
                    <td>${t.trackNum}</td>
                    <td><span class="clickable-link">${t.title}</span></td>
                    <td>${t.lyricist}</td>
                    <td>${t.composer}</td>
                    <td>${t.arranger}</td>
                </tr>
            `).join('');
        }

        // 특정 앨범 이름으로 곡 리스트 필터링
        function filterTracks(albumTitle) {
            if (albumTitle === 'ALL') {
                renderMasterTable(allTracksData);
            } else {
                const filtered = allTracksData.filter(t => t.albumTitle === albumTitle);
                renderMasterTable(filtered);
            }
        }

        // 곡 선택 시 플레이어 및 가사 업데이트
        function selectMasterTrack(index) {
            const track = allTracksData[index];
            if (!track) return;
            currentSelectedTrack = track;

            // 활성화된 행 표시 스타일 변경
            document.querySelectorAll('.master-table tbody tr').forEach((tr, i) => {
                tr.style.backgroundColor = '';
            });
            const activeRow = document.getElementById(`track-row-${index}`);
            if (activeRow) activeRow.style.backgroundColor = '#330000';

            // 플레이어 정보 업데이트
            document.getElementById('player-title').innerText = `${track.albumTitle} - ${track.title}`;
            
            let videoId = track.videoId;
            if (!videoId || videoId === "-" || videoId === "dQw4w9WgXcQ") {
                videoId = track.defaultVideo;
            }
            document.getElementById('player-iframe').src = `https://www.youtube.com/embed/${videoId}`;

            // 가사 업데이트
            const lyricText = (typeof lyricsData !== 'undefined' && lyricsData[track.lyricKey]) 
                ? lyricsData[track.lyricKey] 
                : (track.lyricKey || "가사가 없습니다.");
            document.getElementById('player-lyrics-text').innerText = lyricText;

            // 가사창 닫기 초기화
            isLyricsOpen = false;
            document.getElementById('player-lyrics-box').classList.remove('show');
            document.querySelector('.master-player-display .lyrics-toggle-btn').innerText = '가사 보기 ▼';
        }

        // 가사 토글 버튼
        function toggleMasterLyrics() {
            isLyricsOpen = !isLyricsOpen;
            const box = document.getElementById('player-lyrics-box');
            const btn = document.querySelector('.master-player-display .lyrics-toggle-btn');
            
            if (isLyricsOpen) {
                box.classList.add('show');
                btn.innerText = '가사 접기 ▲';
            } else {
                box.classList.remove('show');
                btn.innerText = '가사 보기 ▼';
            }
        }

        // 싱글 및 참여 음반 렌더링
        function renderInfoSections() {
            const singlesTbody = document.getElementById('singles-tbody');
            if (singlesTbody && typeof singlesInfo !== 'undefined') {
                singlesTbody.innerHTML = singlesInfo.map(s => `
                    <tr>
                        <td>${s.date}</td>
                        <td><a href="https://www.youtube.com/results?search_query=P-TYPE+${encodeURIComponent(s.name)}" target="_blank" class="clickable-link">${s.name}</a></td>
                        <td>${s.type}</td>
                    </tr>
                `).join('');
            }

            const participationTbody = document.getElementById('participation-tbody');
            if (participationTbody && typeof participationInfo !== 'undefined') {
                participationTbody.innerHTML = participationInfo.map(p => `
                    <tr>
                        <td>${p.date}</td>
                        <td><a href="https://www.youtube.com/results?search_query=P-TYPE+${encodeURIComponent(p.name)}" target="_blank" class="clickable-link">${p.name}</a></td>
                        <td>${p.type}</td>
                        <td>${p.desc}</td>
                    </tr>
                `).join('');
            }
        }

        window.onload = function() {
            initMasterTracks();
            renderInfoSections();
        };
    </script>
</body>
</html>
