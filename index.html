<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-TYPE THE BIG CAT</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            background-color: #000000; /* 배경색: 검은색 */
            color: #ff0000;          /* 전체 글자색: 빨간색 */
            text-align: center;
            padding-top: 50px;
        }
        h1 {
            color: #ff0000;          /* 제목 글자색: 빨간색 */
            font-size: 64px;         /* 제목 크기를 크게 설정 */
        }
        p {
            color: #ff4d4d;          /* 본문 글자색: 밝은 빨간색 */
            font-size: 20px;         /* 본문 크기 설정 */
        }
        .site-image {
            width: 300px;            /* 사진 가로 크기 조절 */
            border-radius: 10px;     /* 사진 모서리를 살짝 둥글게 */
            margin: 20px 0;          /* 위아래 여백 주기 */
        }
        .icon-container {
            margin-top: 15px;
            display: flex;           /* 아이콘들을 가로로 나란히 배치 */
            justify-content: center; /* 가운데 정렬 */
            align-items: center;     /* 세로 중앙 정렬 */
            gap: 10px;               /* 아이콘 사이 간격 */
        }
        .social-icon-link {
            display: inline-block;
            width: 50px;             /* 아이콘이 들어갈 공간의 가로 크기 고정 */
            height: 50px;            /* 아이콘이 들어갈 공간의 세로 크기 고정 */
            transition: transform 0.2s;
        }
        .social-icon-link:hover {
            transform: scale(1.1);   /* 마우스 올리면 살짝 커지는 효과 */
        }
        .social-icon {
            width: 100%;             /* 링크 공간 안에 이미지를 꽉 채움 */
            height: 100%;
            object-fit: contain;     /* 이미지 비율을 유지하면서 공간 안에 맞춤 */
        }
    </style>
</head>
<body>
    <h1>P-TYPE THE BIG CAT</h1>
    <p>이곳은 피타입의 음악들의 정보를 담은 웹사이트입니다.</p>
    
    <!-- 메인 사진 -->
    <div>
        <img src="img/P-TYPE.jpg" alt="피타입 사진" class="site-image">
    </div>

    <!-- 소셜 아이콘 링크 영역 (크기 고정 및 정렬) -->
    <div class="icon-container">
        <!-- 인스타그램 링크 -->
        <a href="https://www.instagram.com/ptype_thebigcat?utm_source=ig_web_button_share_sheet&igsi=ZDNlZDc0MzIxNw==" target="_blank" class="social-icon-link">
            <img src="img/instagram.png" alt="인스타그램" class="social-icon">
        </a>
        
        <!-- 유튜브 링크 -->
        <a href="Https://www.youtube.com/channel/UC_BBrruv8aajni5I9muvtEw" target="_blank" class="social-icon-link">
            <img src="img/youtube.png" alt="유튜브" class="social-icon">
        </a>

        <!-- 유튜브 뮤직 링크 (크기 고정 적용) -->
        <a href="https://music.youtube.com/channel/UC_BBrruv8aajni5I9muvtEw?si=ZB1nuf0cdEgdFKBM" target="_blank" class="social-icon-link">
            <img src="img/youtubemusic.png" alt="유튜브 뮤직" class="social-icon">
        </a>
    </div>
</body>
</html>
