<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-TYPE Archive</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 5px;
        }
        .subtitle-top {
            text-align: center;
            color: #ff5252;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 30px;
        }
        h2 {
            color: #ffffff;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .album-section, .info-section {
            background: #1e1e1e;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .album-detail-container::after {
            content: "";
            display: block;
            clear: both;
        }
        .detail-cover {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
            float: left;
            margin-right: 20px;
            margin-bottom: 20px;
            background-color: #333;
        }
        .album-desc {
            margin-bottom: 20px;
            color: #ccc;
            line-height: 1.5;
        }
        .track-table, .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .track-table th, .track-table td, .info-table th, .info-table td {
            border: 1px solid #333;
            padding: 8px 12px;
            text-align: left;
            font-size: 14px;
        }
        .track-table th, .info-table th {
            background-color: #2c2c2c;
        }
        .track-table tr:hover, .info-table tr:hover {
            background-color: #2a2a2a;
        }
        .tracklist-table-container {
            max-height: 220px;
            overflow-y: auto;
            margin-bottom: 20px;
            clear: both;
        }
        .tracklist-table-container::-webkit-scrollbar {
            width: 6px;
        }
        .tracklist-table-container::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }
        .active-track-display {
            margin-top: 20px;
            background: #252525;
            padding: 15px;
            border-radius: 6px;
            clear: both;
        }
        .active-track-title {
            font-size: 18px;
            font-weight: bold;
            color: #ff5252;
            margin-bottom: 10px;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            margin-bottom: 15px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 4px;
        }
        .lyrics-toggle-btn {
            background-color: #333;
            color: #fff;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .lyrics-toggle-btn:hover {
            background-color: #444;
        }
        .lyrics-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: #181818;
            border-radius: 4px;
            padding: 0 15px;
        }
        .lyrics-container.show {
            max-height: 500px;
            overflow-y: auto;
            padding: 15px;
            border: 1px solid #333;
        }
        .lyrics-header {
            font-weight: bold;
            color: #ff5252;
            margin-bottom: 8px;
        }
        .lyrics-text {
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.6;
            color: #ccc;
        }
        .clickable-link {
            color: #4da6ff;
            text-decoration: none;
            cursor: pointer;
        }
        .clickable-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>P-TYPE Archive</h1>
        <div class="subtitle-top">P-TYPE THE BIG CAT</div>
        
        <!-- 정규 앨범 영역 -->
        <div id="album1" class="album-section"></div>
        <div id="album2" class="album-section"></div>
        <div id="album3" class="album-section"></div>
        <div id="album4" class="album-section"></div>
        <div id="album5" class="album-section"></div>

        <!-- 싱글 및 참여 음반 영역 -->
        <div class="info-section">
            <h2>Singles & EPs</h2>
            <table class="info-table">
                <thead>
                    <tr><th>발매일</th><th>제목</th><th>종류</th></tr>
                </thead>
                <tbody id="singles-tbody"></tbody>
            </table>
        </div>

        <div class="info-section">
            <h2>Participation / OST</h2>
            <table class="info-table">
                <thead>
                    <tr><th>발매일</th><th>제목</th><th>종류</th><th>설명</th></tr>
                </thead>
                <tbody id="participation-tbody"></tbody>
            </table>
        </div>
    </div>

    <!-- 순서 중요: lyrics.js가 data.js보다 위에 있어야 합니다 -->
    <script src="lyrics.js"></script>
    <script src="data.js"></script>

    <script>
        const currentActiveTrack = {};
        const currentLyricsState = {};

        function renderAlbumSection(id) {
            const data = albumsData[id];
            if (!data) return;
            const section = document.getElementById(id);
            if (!section) return;

            if (currentActiveTrack[id] === undefined) currentActiveTrack[id] = 0;
            if (currentLyricsState[id] === undefined) currentLyricsState[id] = false;

            const activeIdx = currentActiveTrack[id];
            const activeTrack = data.tracks[activeIdx];
            
            let videoId = activeTrack[5];
            if (!videoId || videoId === "-" || videoId === "dQw4w9WgXcQ") {
                videoId = data.defaultVideo;
            }

            const lyricKey = activeTrack[6];
            const lyricText = (typeof lyricsData !== 'undefined' && lyricsData[lyricKey]) ? lyricsData[lyricKey] : (lyricKey || "가사가 없습니다.");

            let tableRows = data.tracks.map((t, tIndex) => `
                <tr style="${tIndex === activeIdx ? 'background-color: #200000;' : ''}" data-track-index="${tIndex}">
                    <td>${t[0]}</td>
                    <td><span class="clickable-link" onclick="selectTrack('${id}', ${tIndex})">${t[1]}</span></td>
                    <td>${t[2]}</td><td>${t[3]}</td><td>${t[4]}</td>
                </tr>
            `).join('');

            if (!section.querySelector('.album-detail-container')) {
                section.innerHTML = `
                    <div class="album-detail-container">
                        <h2>${data.title}</h2>
                        <img src="${data.cover}" class="detail-cover" alt="${data.title} 커버" onerror="this.src='img/album1.png'">
                        <div class="album-desc">${data.desc}</div>
                        <div class="tracklist-table-container">
                            <table class="track-table">
                                <thead><tr><th>트랙</th><th>제목 (클릭)</th><th>작사</th><th>작곡</th><th>편곡</th></tr></thead>
                                <tbody>${tableRows}</tbody>
                            </table>
                        </div>
                        <div class="active-track-display">
                            <div class="active-track-title">${activeTrack[1]}</div>
                            <div class="video-container"><iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe></div>
                            
                            <button class="lyrics-toggle-btn" onclick="toggleLyrics('${id}')">가사 보기 ▼</button>

                            <div class="lyrics-container">
                                <div class="lyrics-header">[ 가 사 ]</div>
                                <div class="lyrics-text">${lyricText}</div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                section.querySelector('h2').innerText = data.title;
                const coverImg = section.querySelector('.detail-cover');
                if (coverImg && coverImg.src !== data.cover) {
                    coverImg.src = data.cover;
                }
                section.querySelector('.album-desc').innerHTML = data.desc;
                section.querySelector('.active-track-title').innerText = activeTrack[1];

                const iframe = section.querySelector('iframe');
                const newSrc = `https://www.youtube.com/embed/${videoId}`;
                if (!iframe.src.includes(videoId)) {
                    iframe.src = newSrc;
                }
                section.querySelector('.lyrics-text').innerText = lyricText;
                
                const rows = section.querySelectorAll('.track-table tbody tr');
                rows.forEach((row, idx) => {
                    row.style.backgroundColor = (idx === activeIdx) ? '#200000' : '';
                });
            }
        }

        function selectTrack(albumId, trackIndex) {
            currentActiveTrack[albumId] = trackIndex;
            currentLyricsState[albumId] = false;
            
            const section = document.getElementById(albumId);
            if(section) {
                const lyricsContainer = section.querySelector('.lyrics-container');
                const btn = section.querySelector('.lyrics-toggle-btn');
                if(lyricsContainer) lyricsContainer.classList.remove('show');
                if(btn) btn.innerText = '가사 보기 ▼';
            }
            
            renderAlbumSection(albumId);
        }

        function toggleLyrics(albumId) {
            const section = document.getElementById(albumId);
            if (!section) return;

            currentLyricsState[albumId] = !currentLyricsState[albumId];
            const isOpen = currentLyricsState[albumId];

            const lyricsContainer = section.querySelector('.lyrics-container');
            const btn = section.querySelector('.lyrics-toggle-btn');

            if (lyricsContainer && btn) {
                if (isOpen) {
                    lyricsContainer.classList.add('show');
                    btn.innerText = '가사 접기 ▲';
                } else {
                    lyricsContainer.classList.remove('show');
                    btn.innerText = '가사 보기 ▼';
                }
            }
        }

        function renderInfoSections() {
            const singlesTbody = document.getElementById('singles-tbody');
            if (singlesTbody && typeof singlesInfo !== 'undefined') {
                singlesTbody.innerHTML = singlesInfo.map(s => `
                    <tr>
                        <td>${s.date}</td>
                        <td><a href="https://www.youtube.com/results?search_query=P-TYPE+${encodeURIComponent(s.name)}" target="_blank" class="clickable-link">${s.name}</a></td>
                        <td>${s.type}</td>
                    </tr>
                `).join('');
            }

            const participationTbody = document.getElementById('participation-tbody');
            if (participationTbody && typeof participationInfo !== 'undefined') {
                participationTbody.innerHTML = participationInfo.map(p => `
                    <tr>
                        <td>${p.date}</td>
                        <td><a href="https://www.youtube.com/results?search_query=P-TYPE+${encodeURIComponent(p.name)}" target="_blank" class="clickable-link">${p.name}</a></td>
                        <td>${p.type}</td>
                        <td>${p.desc}</td>
                    </tr>
                `).join('');
            }
        }

        window.onload = function() {
            Object.keys(albumsData).forEach(albumId => {
                renderAlbumSection(albumId);
            });
            renderInfoSections();
        };
    </script>
</body>
</html>
