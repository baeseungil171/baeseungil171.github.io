<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-TYPE THE BIG CAT - Discography & Tracklist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">

    <style>
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            background-color: #000000;
            color: #ff0000;
            text-align: center;
            margin: 0;
            padding: 0;
            padding-top: 60px;
        }
        
        /* 내비게이션 바 */
        .navbar {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 60px;
            background-color: rgba(10, 0, 0, 0.95);
            border-bottom: 2px solid #ff0000;
            display: flex; justify-content: center; align-items: center; gap: 20px;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(255, 0, 0, 0.2);
            overflow-x: auto;
            padding: 0 10px;
        }
        .nav-link {
            text-decoration: none; color: #ffffff;
            font-family: 'Black Han Sans', sans-serif; font-size: 15px;
            white-space: nowrap;
            transition: color 0.2s, text-shadow 0.2s;
        }
        .nav-link:hover { color: #ff0000; text-shadow: 0 0 8px rgba(255, 0, 0, 0.6); }

        /* 히어로 섹션 */
        .hero-section { padding: 40px 20px 50px; border-bottom: 2px solid #330000; }
        h1 { font-family: 'Black Han Sans', sans-serif; color: #ff0000; font-size: 72px; letter-spacing: 2px; margin-bottom: 10px; }
        p { color: #ff4d4d; font-size: 20px; }
        .site-image { width: 300px; border-radius: 10px; margin: 20px 0; }
        .icon-container { margin-top: 25px; display: flex; justify-content: center; align-items: center; gap: 30px; }
        .social-icon-link { display: inline-block; width: 80px; height: 80px; transition: transform 0.2s; }
        .social-icon-link:hover { transform: scale(1.1); }
        .social-icon { width: 100%; height: 100%; object-fit: contain; }

        /* 디스코그래피 섹션 */
        .content-section { padding: 80px 20px; border-bottom: 2px solid #330000; }
        .content-section h2 { font-family: 'Black Han Sans', sans-serif; font-size: 40px; color: #ff0000; margin-bottom: 30px; letter-spacing: 1px; }
        
        /* 앨범 그리드 */
        .album-grid { 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; 
            max-width: 1300px; margin: 0 auto; padding: 15px 0 20px; 
        }
        .album-grid.scrollable {
            flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto;
        }
        .album-grid.scrollable::-webkit-scrollbar { height: 8px; }
        .album-grid.scrollable::-webkit-scrollbar-track { background: #110000; }
        .album-grid.scrollable::-webkit-scrollbar-thumb { background: #400000; border-radius: 4px; }

        .album-link { text-decoration: none; flex: 0 0 220px; }
        .album-card { background-color: #110000; border: 1px solid #400000; border-radius: 10px; height: 100%; padding: 15px; transition: transform 0.2s, border-color 0.2s; box-sizing: border-box; }
        .album-link:hover .album-card { transform: translateY(-8px); border-color: #ff0000; }
        .album-cover { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; margin-bottom: 12px; }
        .album-title { font-size: 15px; font-weight: bold; color: #ffffff; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .album-year { font-size: 13px; color: #ff4d4d; }

        /* 앨범 상세 섹션 */
        .album-detail-section { padding: 80px 20px; border-bottom: 1px solid #220000; display: flex; flex-direction: column; align-items: center; scroll-margin-top: 70px; }
        .album-detail-container { max-width: 1100px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 25px; }
        .album-detail-section h3 { font-family: 'Black Han Sans', sans-serif; font-size: 34px; color: #ff0000; margin-bottom: 5px; }
        .detail-cover { width: 220px; height: 220px; object-fit: cover; border-radius: 10px; border: 2px solid #ff0000; box-shadow: 0 0 15px rgba(255, 0, 0, 0.3); }
        .album-detail-section p { color: #cccccc; font-size: 16px; margin-bottom: 10px; }

        /* 트랙리스트 테이블 스타일 */
        .tracklist-table-container { width: 100%; overflow-x: auto; margin-top: 15px; }
        .track-table { width: 100%; border-collapse: collapse; background-color: #080000; border: 1px solid #400000; text-align: left; font-size: 14px; }
        .track-table th, .track-table td { padding: 12px 15px; border-bottom: 1px solid #330000; }
        .track-table th { background-color: #1a0000; color: #ff0000; font-family: 'Black Han Sans', sans-serif; font-size: 16px; text-align: center; letter-spacing: 1px; }
        .track-table td:nth-child(1) { text-align: center; color: #ff4d4d; font-weight: bold; width: 80px; }
        .track-table td:nth-child(2) { color: #ffffff; font-weight: bold; cursor: pointer; text-decoration: underline; text-decoration-color: #550000; }
        .track-table td:nth-child(2):hover { color: #ff4d4d; }
        .track-table td:nth-child(3), .track-table td:nth-child(4), .track-table td:nth-child(5) { color: #cc9999; }
        .track-table tr:hover { background-color: #150000; }

        /* 미디어 & 가사 출력 박스 */
        .active-track-display {
            width: 100%; background-color: #110000; border: 1px solid #400000; border-radius: 8px;
            padding: 25px; box-sizing: border-box; margin-top: 20px; display: flex; flex-direction: column; align-items: center;
        }
        .active-track-title {
            font-family: 'Black Han Sans', sans-serif; font-size: 22px; color: #ff0000; margin-bottom: 20px; letter-spacing: 1px;
            border-bottom: 1px solid #400000; padding-bottom: 8px; width: 100%; text-align: center;
        }
        .video-container { position: relative; width: 100%; max-width: 800px; padding-bottom: 56.25%; height: 0; margin-bottom: 25px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 6px; border: 1px solid #400000; }
        
        .lyrics-container {
            width: 100%; background-color: #080000; border: 1px solid #330000; border-radius: 6px; padding: 25px; box-sizing: border-box;
            text-align: center;
        }
        .lyrics-header { font-family: 'Black Han Sans', sans-serif; font-size: 16px; color: #ff4d4d; margin-bottom: 15px; }
        .lyrics-text { color: #ffffff; white-space: pre-line; line-height: 1.8; font-size: 15px; }
    </style>
</head>

        <a href="#album2" class="nav-link">2집</a>
        <a href="#album3" class="nav-link">3집</a>
        <a href="#album4" class="nav-link">4집</a>
        <a href="#album5" class="nav-link">5집</a>
        <a href="#singles-section" class="nav-link">싱글음반</a>
        <a href="#part-section" class="nav-link">참여음반</a>
    </div>
