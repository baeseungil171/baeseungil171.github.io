<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-TYPE THE BIG CAT - Discography & Tracklist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">

    <style>
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            background-color: #000000;
            color: #ff0000;
            text-align: center;
            margin: 0;
            padding: 0;
            padding-top: 60px;
        }
        
        /* 내비게이션 바 */
        .navbar {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 60px;
            background-color: rgba(10, 0, 0, 0.95);
            border-bottom: 2px solid #ff0000;
            display: flex; justify-content: center; align-items: center; gap: 20px;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(255, 0, 0, 0.2);
            overflow-x: auto;
            padding: 0 10px;
        }
        .nav-link {
            text-decoration: none; color: #ffffff;
            font-family: 'Black Han Sans', sans-serif; font-size: 15px;
            white-space: nowrap;
            transition: color 0.2s, text-shadow 0.2s;
        }
        .nav-link:hover { color: #ff0000; text-shadow: 0 0 8px rgba(255, 0, 0, 0.6); }

        /* 히어로 섹션 */
        .hero-section { padding: 40px 20px 50px; border-bottom: 2px solid #330000; }
        h1 { font-family: 'Black Han Sans', sans-serif; color: #ff0000; font-size: 72px; letter-spacing: 2px; margin-bottom: 10px; }
        p { color: #ff4d4d; font-size: 20px; }
        .site-image { width: 300px; border-radius: 10px; margin: 20px 0; }
        .icon-container { margin-top: 25px; display: flex; justify-content: center; align-items: center; gap: 30px; }
        .social-icon-link { display: inline-block; width: 80px; height: 80px; transition: transform 0.2s; }
        .social-icon-link:hover { transform: scale(1.1); }
        .social-icon { width: 100%; height: 100%; object-fit: contain; }

        /* 디스코그래피 섹션 */
        .content-section { padding: 80px 20px; border-bottom: 2px solid #330000; }
        .content-section h2 { font-family: 'Black Han Sans', sans-serif; font-size: 40px; color: #ff0000; margin-bottom: 30px; letter-spacing: 1px; }
        
        .album-grid { 
            display: flex; 
            flex-wrap: nowrap; 
            justify-content: flex-start; 
            gap: 20px; 
            max-width: 1300px; 
            margin: 0 auto; 
            overflow-x: auto; 
            padding: 15px 0 20px; 
        }
        .album-grid::-webkit-scrollbar { height: 8px; }
        .album-grid::-webkit-scrollbar-track { background: #110000; }
        .album-grid::-webkit-scrollbar-thumb { background: #400000; border-radius: 4px; }

        .album-link { text-decoration: none; flex: 0 0 220px; }
        .album-card { background-color: #110000; border: 1px solid #400000; border-radius: 10px; height: 100%; padding: 15px; transition: transform 0.2s, border-color 0.2s; box-sizing: border-box; }
        .album-link:hover .album-card { transform: translateY(-8px); border-color: #ff0000; }
        .album-cover { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; margin-bottom: 12px; }
        .album-title { font-size: 15px; font-weight: bold; color: #ffffff; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .album-year { font-size: 13px; color: #ff4d4d; }

        /* 앨범 상세 섹션 */
        .album-detail-section { padding: 80px 20px; border-bottom: 1px solid #220000; display: flex; flex-direction: column; align-items: center; scroll-margin-top: 70px; }
        .album-detail-container { max-width: 1100px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 25px; }
        .album-detail-section h3 { font-family: 'Black Han Sans', sans-serif; font-size: 34px; color: #ff0000; margin-bottom: 5px; }
        .detail-cover { width: 220px; height: 220px; object-fit: cover; border-radius: 10px; border: 2px solid #ff0000; box-shadow: 0 0 15px rgba(255, 0, 0, 0.3); }
        .album-detail-section p { color: #cccccc; font-size: 16px; margin-bottom: 10px; }

        /* 트랙리스트 테이블 스타일 */
        .tracklist-table-container { width: 100%; overflow-x: auto; margin-top: 15px; }
        .track-table { width: 100%; border-collapse: collapse; background-color: #080000; border: 1px solid #400000; text-align: left; font-size: 14px; }
        .track-table th, .track-table td { padding: 12px 15px; border-bottom: 1px solid #330000; }
        .track-table th { background-color: #1a0000; color: #ff0000; font-family: 'Black Han Sans', sans-serif; font-size: 16px; text-align: center; letter-spacing: 1px; }
        .track-table td:nth-child(1) { text-align: center; color: #ff4d4d; font-weight: bold; width: 80px; }
        .track-table td:nth-child(2) { color: #ffffff; font-weight: bold; }
        .track-table td:nth-child(3), .track-table td:nth-child(4), .track-table td:nth-child(5) { color: #cc9999; }
        .track-table tr:hover { background-color: #150000; }

        /* 사운드트랙 박스 */
        .soundtrack-box { width: 100%; background-color: #110000; border: 1px solid #400000; border-radius: 8px; padding: 20px; box-sizing: border-box; margin-top: 20px; }
        .soundtrack-box h4 { color: #ff0000; font-size: 18px; margin-top: 0; margin-bottom: 15px; font-family: 'Black Han Sans', sans-serif; }
        .video-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; margin-top: 10px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 6px; border: 1px solid #400000; }
    </style>
</head>
<body>

    <!-- 고정 내비게이션 바 -->
    <div class="navbar">
        <a href="#" class="nav-link">HOME</a>
        <a href="#album1" class="nav-link">1집</a>
        <a href="#album2" class="nav-link">2집</a>
        <a href="#album3" class="nav-link">3집</a>
        <a href="#album4" class="nav-link">4집</a>
        <a href="#album5" class="nav-link">5집</a>
        <a href="#singles-section" class="nav-link">싱글음반</a>
    </div>

    <div class="hero-section">
        <h1>P-TYPE THE BIG CAT</h1>
        <p>이곳은 피타입의 음악들의 정보를 담은 웹사이트입니다.</p>
        <div><img src="img/P-TYPE.jpg" alt="피타입 사진" class="site-image"></div>
        <div class="icon-container">
            <a href="https://www.instagram.com/ptype_thebigcat" target="_blank" class="social-icon-link"><img src="img/instagram.png" alt="인스타그램" class="social-icon"></a>
            <a href="https://www.youtube.com/channel/UC_BBrruv8aajni5I9muvtEw" target="_blank" class="social-icon-link"><img src="img/youtube.png" alt="유튜브" class="social-icon"></a>
            <a href="https://music.youtube.com/channel/UC_BBrruv8aajni5I9muvtEw" target="_blank" class="social-icon-link"><img src="img/youtubemusic.png" alt="유튜브 뮤직" class="social-icon"></a>
        </div>
    </div>

    <!-- 정규 앨범 섹션 -->
    <div class="content-section">
        <h2>STUDIO ALBUMS</h2>
        <div class="album-grid">
            <a href="#album1" class="album-link"><div class="album-card"><img src="img/album1.png" class="album-cover"><div class="album-title">Heavy Bass</div><div class="album-year">2004.05.31</div></div></a>
            <a href="#album2" class="album-link"><div class="album-card"><img src="img/album2.png" class="album-cover"><div class="album-title">The Vintage</div><div class="album-year">2008.11.27</div></div></a>
            <a href="#album3" class="album-link"><div class="album-card"><img src="img/album3.png" class="album-cover"><div class="album-title">RAP</div><div class="album-year">2013.07.29</div></div></a>
            <a href="#album4" class="album-link"><div class="album-card"><img src="img/album4.png" class="album-cover"><div class="album-title">Street Poetry</div><div class="album-year">2015.03.20</div></div></a>
            <a href="#album5" class="album-link"><div class="album-card"><img src="img/album5.png" class="album-cover"><div class="album-title">Hardboiled Café 5</div><div class="album-year">2022.02.18</div></div></a>
        </div>
    </div>

    <!-- 싱글음반 섹션 (21개 자동 생성) -->
    <div id="singles-section" class="content-section">
        <h2>싱글음반</h2>
        <div class="album-grid" id="singles-grid"></div>
    </div>

    <!-- 정규 앨범 상세 영역 -->
    <div id="album1" class="album-detail-section" data-album="album1"></div>
    <div id="album2" class="album-detail-section" data-album="album2"></div>
    <div id="album3" class="album-detail-section" data-album="album3"></div>
    <div id="album4" class="album-detail-section" data-album="album4"></div>
    <div id="album5" class="album-detail-section" data-album="album5"></div>

    <!-- 싱글음반 상세 영역 컨테이너 -->
    <div id="singles-details-container"></div>

    <script>
        const albumsData = {
            album1: {
                title: "1집 - Heavy Bass (2004.05.31)",
                desc: "한국 힙합 역사상 가장 찬란한 명반 중 하나로 꼽히는 피타입의 정규 1집 데뷔 앨범입니다.",
                cover: "img/album1.png",
                youtubeId: "YOUR_YOUTUBE_VIDEO_ID_1",
                tracks: [
                    ["01", "서시", "P-TYPE", "Keeproots", "Keeproots"],
                    ["02", "Skit - 보여주고 증명하라", "P-TYPE", "P-TYPE", "P-TYPE"]
                ]
            },
            album2: {
                title: "2집 - The Vintage (2008.11.27)",
                desc: "특유의 클래식하고 묵직한 서정성이 돋보이는 정규 2집 앨범입니다.",
                cover: "img/album2.png",
                youtubeId: "YOUR_YOUTUBE_VIDEO_ID_2",
                tracks: [
                    ["01", "Intro", "P-Type", "-", "-"],
                    ["02", "비를 위한 발라드 (Feat. Gina)", "P-Type", "Keeproots", "Keeproots"]
                ]
            },
            album3: {
                title: "3집 - RAP (2013.07.29)",
                desc: "랩이라는 장르와 그 본질에 대한 깊은 고찰이 담긴 정규 3집 앨범입니다.",
                cover: "img/album3.png",
                youtubeId: "YOUR_YOUTUBE_VIDEO_ID_3",
                tracks: [
                    ["01", "I’m Back", "P-type", "Ging, Optical Eyez XL", "Ging, Optical Eyez XL"]
                ]
            },
            album4: {
                title: "4집 - Street Poetry (2015.03.20)",
                desc: "거리의 시인으로서 피타입의 날카로운 통찰력과 가사가 돋보이는 4집 앨범입니다.",
                cover: "img/album4.png",
                youtubeId: "YOUR_YOUTUBE_VIDEO_ID_4",
                tracks: [
                    ["01", "폭력적인 잡종문화", "P-Type", "Ronald Bell 외", "Kay Gee's, Deepfry"]
                ]
            },
            album5: {
                title: "5집 - Hardboiled Café 5 (2022.02.18)",
                desc: "하드보일드한 감성을 담아내며 건재함을 증명한 정규 5집 앨범입니다.",
                cover: "img/album5.png",
                youtubeId: "YOUR_YOUTUBE_VIDEO_ID_5",
                tracks: [
                    ["01", "Writer's Profile", "P-TYPE", "Keeproots", "Keeproots"]
                ]
            }
        };

        // 이미지에 나온 21개 싱글/무료 음반 정보 배열
        const singlesInfo = [
            { name: "Soulfire", date: "2006.09.07.", type: "싱글 1집" },
            { name: "다이하드", date: "2013.03.22.", type: "싱글" },
            { name: "Lyrical Saurus", date: "2013.11.08.", type: "무료 음원" },
            { name: "불편한 관계", date: "2013.11.27.", type: "싱글" },
            { name: "Timberland 6\"", date: "2014.05.28.", type: "싱글" },
            { name: "광화문", date: "2015.03.11.", type: "싱글" },
            { name: "버드맨", date: "2015.07.06.", type: "싱글" },
            { name: "시차적응", date: "2015.11.09.", type: "싱글" },
            { name: "게으르게", date: "2016.07.04.", type: "싱글" },
            { name: "2 years part.1", date: "2017.06.19.", type: "더블 싱글" },
            { name: "Explicit Content", date: "2020.02.03.", type: "더블 싱글" },
            { name: "블루문특급", date: "2020.05.03.", type: "싱글" },
            { name: "바벨", date: "2020.07.03.", type: "싱글" },
            { name: "TBS 특집 다큐멘터리 '2020 전태일 랩소디'", date: "2020.11.19.", type: "싱글" },
            { name: "신도시", date: "2021.02.18.", type: "싱글" },
            { name: "Ordinary Verse", date: "2021.03.18.", type: "싱글" },
            { name: "The Dog Walker", date: "2021.07.22.", type: "싱글" },
            { name: "MIC \"The Hammer\"", date: "2022.02.11.", type: "싱글" },
            { name: "2022 영등포", date: "2022.10.18.", type: "싱글" },
            { name: "추가 싱글 20", date: "202X.XX.XX.", type: "싱글" },
            { name: "추가 싱글 21", date: "202X.XX.XX.", type: "싱글" }
        ];

        const singlesData = {};
        const singlesGrid = document.getElementById('singles-grid');
        const singlesDetailsContainer = document.getElementById('singles-details-container');

        singlesInfo.forEach((item, index) => {
            const i = index + 1;
            const key = `single${i}`;
            
            singlesData[key] = {
                title: `${item.type} - ${item.name} (${item.date})`,
                desc: `피타입의 ${item.type} 음반 <${item.name}>입니다. (발매일: ${item.date})`,
                cover: `img/single${i}.png`,
                youtubeId: `YOUR_YOUTUBE_VIDEO_ID_SINGLE_${i}`,
                tracks: [
                    ["01", item.name, "P-TYPE", "Producer", "Arranger"]
                ]
            };

            // 싱글 디스코그래피 카드 생성
            singlesGrid.innerHTML += `
                <a href="#${key}" class="album-link">
                    <div class="album-card">
                        <img src="img/single${i}.png" alt="${item.name} 커버" class="album-cover" onerror="this.src='img/album1.png'">
                        <div class="album-title">${item.name}</div>
                        <div class="album-year">${item.date}</div>
                    </div>
                </a>
            `;

            // 싱글 상세 섹션 생성
            singlesDetailsContainer.innerHTML += `
                <div id="${key}" class="album-detail-section" data-album="${key}"></div>
            `;
        });

        // 앨범 렌더링
        const allData = { ...albumsData, ...singlesData };

        document.querySelectorAll('.album-detail-section').forEach(section => {
            const id = section.getAttribute('data-album');
            const data = allData[id];
            if (!data) return;

            let tableRows = data.tracks.map(t => `
                <tr><td>${t[0]}</td><td>${t[1]}</td><td>${t[2]}</td><td>${t[3]}</td><td>${t[4]}</td></tr>
            `).join('');

            section.innerHTML = `
                <div class="album-detail-container">
                    <h3>${data.title}</h3>
                    <img src="${data.cover}" alt="앨범 커버" class="detail-cover" onerror="this.src='img/album1.png'">
                    <p>${data.desc}</p>
                    <div class="tracklist-table-container">
                        <table class="track-table">
                            <thead>
                                <tr><th>트랙</th><th>제목</th><th>작사</th><th>작곡</th><th>편곡</th></tr>
                            </thead>
                            <tbody>${tableRows}</tbody>
                        </table>
                    </div>
                    <div class="soundtrack-box">
                        <h4>SOUNDTRACK / PREVIEW</h4>
                        <div class="video-container">
                            <iframe src="https://www.youtube.com/embed/${data.youtubeId}" title="사운드트랙" allowfullscreen></iframe>
                        </div>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
