<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-TYPE THE BIG CAT - Discography & Tracklist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">

    <style>
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            background-color: #000; color: #ff0000;
            text-align: center; margin: 0; padding-top: 60px;
        }
        
        /* 내비게이션 바 */
        .navbar {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px;
            background-color: rgba(10, 0, 0, 0.95); border-bottom: 2px solid #ff0000;
            display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 1000;
            overflow-x: auto; padding: 0 10px;
        }
        .nav-link {
            text-decoration: none; color: #fff; font-family: 'Black Han Sans', sans-serif; font-size: 15px;
            white-space: nowrap; transition: color 0.2s, text-shadow 0.2s;
        }
        .nav-link:hover { color: #ff0000; text-shadow: 0 0 8px rgba(255, 0, 0, 0.6); }

        /* 히어로 섹션 */
        .hero-section { padding: 40px 20px 50px; border-bottom: 2px solid #330000; }
        h1 { font-family: 'Black Han Sans', sans-serif; color: #ff0000; font-size: 60px; margin-bottom: 10px; }
        p { color: #ff4d4d; font-size: 18px; }
        .site-image { width: 250px; border-radius: 10px; margin: 20px 0; }
        .icon-container { margin-top: 25px; display: flex; justify-content: center; align-items: center; gap: 30px; }
        .social-icon-link { display: inline-block; width: 60px; height: 60px; transition: transform 0.2s; }
        .social-icon-link:hover { transform: scale(1.1); }
        .social-icon { width: 100%; height: 100%; object-fit: contain; }

        /* 디스코그래피 섹션 */
        .content-section { padding: 60px 20px; border-bottom: 2px solid #330000; }
        .content-section h2 { font-family: 'Black Han Sans', sans-serif; font-size: 36px; color: #ff0000; margin-bottom: 25px; }
        
        .album-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .album-grid.scrollable { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; padding-bottom: 10px; }
        .album-grid.scrollable::-webkit-scrollbar { height: 8px; }
        .album-grid.scrollable::-webkit-scrollbar-track { background: #110000; }
        .album-grid.scrollable::-webkit-scrollbar-thumb { background: #400000; border-radius: 4px; }

        .album-link { text-decoration: none; flex: 0 0 200px; }
        .album-card { background-color: #110000; border: 1px solid #400000; border-radius: 10px; padding: 15px; transition: transform 0.2s, border-color 0.2s; height: 100%; box-sizing: border-box; }
        .album-link:hover .album-card { transform: translateY(-5px); border-color: #ff0000; }
        .album-cover { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; }
        .album-title { font-size: 14px; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .album-year { font-size: 12px; color: #ff4d4d; margin-top: 4px; }

        /* 앨범 상세 섹션 */
        .album-detail-section { padding: 60px 20px; border-bottom: 1px solid #220000; display: flex; flex-direction: column; align-items: center; scroll-margin-top: 70px; }
        .album-detail-container { max-width: 1000px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .album-detail-section h3 { font-family: 'Black Han Sans', sans-serif; font-size: 30px; color: #ff0000; }
        .detail-cover { width: 200px; height: 200px; object-fit: cover; border-radius: 10px; border: 2px solid #ff0000; }
        .album-detail-section p { color: #ccc; font-size: 15px; }

        /* 트랙리스트 테이블 */
        .tracklist-table-container { width: 100%; overflow-x: auto; }
        .track-table { width: 100%; border-collapse: collapse; background-color: #080000; border: 1px solid #400000; text-align: left; font-size: 13px; }
        .track-table th, .track-table td { padding: 10px 12px; border-bottom: 1px solid #330000; }
        .track-table th { background-color: #1a0000; color: #ff0000; font-family: 'Black Han Sans', sans-serif; text-align: center; }
        .track-table td:nth-child(1) { text-align: center; color: #ff4d4d; font-weight: bold; width: 60px; }
        .track-table td:nth-child(2) { color: #fff; font-weight: bold; cursor: pointer; text-decoration: underline; text-decoration-color: #550000; }
        .track-table td:nth-child(2):hover { color: #ff4d4d; }
        .track-table tr:hover { background-color: #150000; }

        /* 미디어 & 가사 박스 */
        .active-track-display { width: 100%; background-color: #110000; border: 1px solid #400000; border-radius: 8px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; margin-top: 15px; }
        .active-track-title { font-family: 'Black Han Sans', sans-serif; font-size: 20px; color: #ff0000; margin-bottom: 15px; border-bottom: 1px solid #400000; padding-bottom: 6px; width: 100%; text-align: center; }
        .video-container { position: relative; width: 100%; max-width: 700px; padding-bottom: 56.25%; height: 0; margin-bottom: 20px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 6px; border: 1px solid #400000; }
        .lyrics-container { width: 100%; background-color: #080000; border: 1px solid #330000; border-radius: 6px; padding: 20px; text-align: center; }
        .lyrics-header { font-family: 'Black Han Sans', sans-serif; font-size: 15px; color: #ff4d4d; margin-bottom: 10px; }
        .lyrics-text { color: #fff; white-space: pre-line; line-height: 1.7; font-size: 14px; }
    </style>
</head>
