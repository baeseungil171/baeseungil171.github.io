<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-TYPE THE BIG CAT</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            background-color: #000000; /* 배경색: 검은색 */
            color: #ff0000;          /* 전체 글자색: 빨간색 */
            text-align: center;
            padding-top: 50px;
        }
        h1 {
            color: #ff0000;          /* 제목 글자색: 빨간색 */
            font-size: 64px;         /* 제목 크기를 크게 설정 */
        }
        p {
            color: #ff4d4d;          /* 본문 글자색: 밝은 빨간색 */
            font-size: 20px;         /* 본문 크기 설정 */
        }
        .site-image {
            width: 300px;            /* 사진 가로 크기 조절 */
            border-radius: 10px;     /* 사진 모서리를 살짝 둥글게 */
            margin: 20px 0;          /* 위아래 여백 주기 */
        }
        .icon-container {
            margin-top: 15px;
        }
        .social-icon {
            width: 50px;             /* 아이콘 크기 조절 */
            margin: 0 10px;          /* 아이콘들 사이의 간격 주기 */
            transition: transform 0.2s;
        }
        .social-icon:hover {
            transform: scale(1.1);   /* 마우스 올리면 살짝 커지는 효과 */
        }
    </style>
</head>
<body>
    <h1>P-TYPE THE BIG CAT</h1>
    <p>이곳은 피타입의 음악들의 정보를 담은 웹사이트입니다.</p>
    
    <!-- 메인 사진 -->
    <div>
        <img src="P-TYPE.jpg" alt="피타입 사진" class="site-image">
    </div>

    <!-- 소셜 아이콘 링크 영역 (인스타그램 + 유튜브) -->
    <div class="icon-container">
        <!-- 인스타그램 링크 -->
        <a href="https://www.instagram.com/ptype_thebigcat?utm_source=ig_web_button_share_sheet&igsi=ZDNlZDc0MzIxNw==" target="_blank">
            <img src="instagram.png" alt="인스타그램으로 이동" class="social-icon">
        </a>
        
        <!-- 유튜브 링크 (.jpg 적용) -->
        <a href="Https://www.youtube.com/channel/UC_BBrruv8aajni5I9muvtEw" target="_blank">
            <img src="youtube.jpg" alt="유튜브로 이동" class="social-icon">
        </a>
    </div>
</body>
</html>
